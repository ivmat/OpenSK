[standard]
id = "cbor-api-slice"
title = "RFC 8949 wire rules, CTAP scalar-key rules, pinned public API and Appendix A"
edition = "8949 / CTAP 2.1 / pinned API"
provenance = "external"
slice = true
slice_note = "Declared codec slice; application semantics and full generic-decoder support are excluded explicitly."
numbering = "RFC/CTAP sections and public item paths"

[[clause]]
id = "RFC-HEAD"
ref = "RFC 8949 §3"
title = "The initial byte of each data item contains both information about the major type (the high-order 3 bits, described in Section 3.1) and additional information (the low-order 5 bits)."
force = "grammar"
side = "decoder"

[[clause]]
id = "RFC-ARG"
ref = "RFC 8949 §3"
title = "The argument’s value is held in the following 1, 2, 4, or 8 bytes, respectively, in network byte order."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-UINT"
ref = "RFC 8949 §3.1 major type 0"
title = "An unsigned integer in the range 0..2^(64)-1 inclusive. The value of the encoded item is the argument itself."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-NINT"
ref = "RFC 8949 §3.1 major type 1"
title = "A negative integer in the range -2^(64)..-1 inclusive. The value of the item is -1 minus the argument."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-BSTR"
ref = "RFC 8949 §3.1 major type 2"
title = "A byte string. The number of bytes in the string is equal to the argument."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-TSTR"
ref = "RFC 8949 §3.1 major type 3"
title = "A text string (Section 2) encoded as UTF-8 [RFC3629]. The number of bytes in the string is equal to the argument."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-ARRAY"
ref = "RFC 8949 §3.1 major type 4"
title = "The argument is the number of data items in the array."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-MAP"
ref = "RFC 8949 §3.1 major type 5"
title = "The argument is the number of pairs of data items in the map."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-TAG"
ref = "RFC 8949 §3.1 major type 6"
title = "A tagged data item (\"tag\") whose tag number, an integer in the range 0..2^(64)-1 inclusive, is the argument and whose enclosed data item (tag content) is the single encoded data item that follows the head."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-SIMPLE"
ref = "RFC 8949 §3.3 Table 4"
title = "20: false; 21: true; 22: null; 23: undefined."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-RESERVED"
ref = "RFC 8949 §3"
title = "28, 29, 30: These values are reserved for future additions to the CBOR format. In the present version of CBOR, the encoded item is not well-formed."
force = "grammar"
side = "decoder"

[[clause]]
id = "RFC-SIMPLE-RESERVED"
ref = "RFC 8949 §3.3"
title = "An encoder MUST NOT issue two-byte sequences that start with 0xf8 (major type 7, additional information 24) and continue with a byte less than 0x20 (32 decimal). Such sequences are not well-formed."
force = "MUST NOT"
side = "encoder"

[[clause]]
id = "RFC-SHORT"
ref = "RFC 8949 §4.2.1"
title = "Preferred serialization MUST be used."
force = "MUST"
side = "encoder"

[[clause]]
id = "RFC-DEFINITE"
ref = "RFC 8949 §4.2.1"
title = "Indefinite-length items MUST NOT appear."
force = "MUST NOT"
side = "encoder"

[[clause]]
id = "RFC-ORDER"
ref = "RFC 8949 §4.2.1"
title = "The keys in every map MUST be sorted in the bytewise lexicographic order of their deterministic encodings."
force = "MUST"
side = "encoder"

[[clause]]
id = "RFC-DUP"
ref = "RFC 8949 §3.1 major type 5"
title = "A map that has duplicate keys may be well-formed, but it is not valid, and thus it causes indeterminate decoding; see also Section 5.6."
force = "grammar"
side = "decoder"

[[clause]]
id = "RFC-UTF8"
ref = "RFC 8949 §3.1 major type 3"
title = "A string containing an invalid UTF-8 sequence is well-formed but invalid (Section 1.2)."
force = "grammar"
side = "decoder"

[[clause]]
id = "RFC-INVALID"
ref = "RFC 8949 §5.3"
title = "The first layer that does process the semantics of an invalid CBOR item MUST pick one of two choices: 1. Replace the problematic item with an error marker and continue with the next item, or 2. Issue an error and stop processing altogether."
force = "MUST"
side = "decoder"

[[clause]]
id = "RFC-TRUNC"
ref = "RFC 8949 §3"
title = "If the encoded sequence of bytes ends before the end of a data item, that item is not well-formed."
force = "grammar"
side = "decoder"

[[clause]]
id = "CTAP-ORDER"
ref = "CTAP 2.1 §8"
title = "The keys in every map MUST be sorted lowest value to highest. If the major types are different, the one with the lower value in numerical order sorts earlier."
force = "MUST"
side = "encoder"

[[clause]]
id = "CTAP-ORDER-LENGTH"
ref = "CTAP 2.1 §8"
title = "If two keys have different lengths, the shorter one sorts earlier;"
force = "MUST (ordering subrule)"
side = "encoder"

[[clause]]
id = "CTAP-ORDER-BYTES"
ref = "CTAP 2.1 §8"
title = "If two keys have the same length, the one with the lower value in (byte-wise) lexical order sorts earlier."
force = "MUST (ordering subrule)"
side = "encoder"

[[clause]]
id = "CTAP-FOUR"
ref = "CTAP 2.1 §8"
title = "Authenticators MUST support at least 4 levels of CBOR nesting."
force = "MUST"
side = "both"

[[clause]]
id = "RFC-FLOAT"
ref = "RFC 8949 §3.3"
title = "The 5-bit values of 25, 26, and 27 are for 16-bit, 32-bit, and 64-bit IEEE 754 binary floating-point values [IEEE754]."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-FLOAT-SHORT"
ref = "RFC 8949 §4.2.1"
title = "Floating-point values also MUST use the shortest form that preserves the value"
force = "MUST"
side = "encoder"

[[clause]]
id = "CTAP-FLOAT"
ref = "CTAP 2.1 §8"
title = "The representations of any floating-point values are not changed."
force = "encoding rule"
side = "encoder"

[[clause]]
id = "RFC-GENERIC"
ref = "RFC 8949 §5.2"
title = "A generic CBOR decoder can decode all well-formed encoded CBOR data items and present the data items to an application."
force = "definition"
side = "decoder"

[[clause]]
id = "RFC-7049-ORDER"
ref = "RFC 7049 §3.9"
title = "If two keys have different lengths, the shorter one sorts earlier; If two keys have the same length, the one with the lower value in (byte-wise) lexical order sorts earlier."
force = "suggestion"
side = "encoder"

[[clause]]
id = "CTAP-NO-TAGS"
ref = "CTAP 2.1 §8"
title = "Tags as defined in Section 2.4 in [RFC8949] MUST NOT be present."
force = "MUST NOT"
side = "both"

[[clause]]
id = "CTAP-MAX-DEPTH"
ref = "CTAP 2.1 §8"
title = "Clients, platforms, and servers MUST NOT use more than 4 levels of CBOR nesting."
force = "MUST NOT"
side = "both"

[[clause]]
id = "CDDL"
ref = "RFC 8610 §1"
title = "The main goal for the Concise Data Definition Language (CDDL) is to provide an easy and unambiguous way to express structures for data items in the Concise Binary Object Representation (CBOR) [RFC7049] and JSON [RFC8259]."
force = "informative"
side = "both"

