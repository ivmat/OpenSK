title = "The initial byte of each data item contains both information about the major type (the high-order 3 bits, described in Section 3.1) and additional information (the low-order 5 bits)."
force = "grammar"
side = "decoder"

[[clause]]
id = "RFC-ARG"
ref = "RFC 8949 §3"
title = "The argument’s value is held in the following 1, 2, 4, or 8 bytes, respectively, in network byte order."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-UINT"
ref = "RFC 8949 §3.1 major type 0"
title = "An unsigned integer in the range 0..2^(64)-1 inclusive. The value of the encoded item is the argument itself."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-NINT"
ref = "RFC 8949 §3.1 major type 1"
title = "A negative integer in the range -2^(64)..-1 inclusive. The value of the item is -1 minus the argument."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-BSTR"
ref = "RFC 8949 §3.1 major type 2"
title = "A byte string. The number of bytes in the string is equal to the argument."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-TSTR"
ref = "RFC 8949 §3.1 major type 3"
title = "A text string (Section 2) encoded as UTF-8 [RFC3629]. The number of bytes in the string is equal to the argument."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-ARRAY"
ref = "RFC 8949 §3.1 major type 4"
title = "The argument is the number of data items in the array."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-MAP"
ref = "RFC 8949 §3.1 major type 5"
title = "The argument is the number of pairs of data items in the map."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-TAG"
ref = "RFC 8949 §3.1 major type 6"
title = "A tagged data item (\"tag\") whose tag number, an integer in the range 0..2^(64)-1 inclusive, is the argument and whose enclosed data item (tag content) is the single encoded data item that follows the head."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-SIMPLE"
ref = "RFC 8949 §3.3 Table 4"
title = "20: false; 21: true; 22: null; 23: undefined."
force = "grammar"
side = "both"

[[clause]]
id = "RFC-RESERVED"
ref = "RFC 8949 §3"
title = "28, 29, 30: These values are reserved for future additions to the CBOR format. In the present version of CBOR, the encoded item is not well-formed."
force = "grammar"
side = "decoder"

[[clause]]
id = "RFC-SIMPLE-RESERVED"
ref = "RFC 8949 §3.3"
title = "An encoder MUST NOT issue two-byte sequences that start with 0xf8 (major type 7, additional information 24) and continue with a byte less than 0x20 (32 decimal). Such sequences are not well-formed."
force = "MUST NOT"
side = "encoder"

[[clause]]
id = "RFC-SHORT"
ref = "RFC 8949 §4.2.1"
title = "Preferred serialization MUST be used."
force = "MUST"
side = "encoder"

[[clause]]
id = "RFC-DEFINITE"
