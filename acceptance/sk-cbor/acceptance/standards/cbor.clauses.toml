ref = "RFC 8949 §5.3"
title = "The first layer that does process the semantics of an invalid CBOR item MUST pick one of two choices: 1. Replace the problematic item with an error marker and continue with the next item, or 2. Issue an error and stop processing altogether."
force = "MUST"
side = "decoder"

[[clause]]
